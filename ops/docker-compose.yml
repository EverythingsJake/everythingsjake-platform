services:
  # Traefik: Edge reverse proxy and ACME (Let's Encrypt).
  # Exposes ports 80/443, mounts the Docker socket and Traefik config,
  # and routes/terminates TLS for other services via labels.
  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./letsencrypt:/letsencrypt
    restart: unless-stopped

  # Site (production): Next.js app served on container port 3000.
  # Image: ghcr.io/everythingsjake/everythingsjake-platform:main
  # Healthcheck pings `/healthz`. Routed by Traefik and updated by Watchtower
  site:
    image: ghcr.io/everythingsjake/everythingsjake-platform:main
    container_name: everythingsjake-site
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"

      # HTTP router: redirect to HTTPS
      - "traefik.http.routers.site-http.rule=Host(`everythingsjake.net`) || Host(`www.everythingsjake.net`)"
      - "traefik.http.routers.site-http.entrypoints=web"
      - "traefik.http.routers.site-http.middlewares=redirect-to-https"

      # Redirect middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # HTTPS router: serve the app with TLS via Let's Encrypt
      - "traefik.http.routers.site-https.rule=Host(`everythingsjake.net`) || Host(`www.everythingsjake.net`)"
      - "traefik.http.routers.site-https.entrypoints=websecure"
      - "traefik.http.routers.site-https.tls=true"
      - "traefik.http.routers.site-https.tls.certresolver=letsencrypt"

      # Site points to container port 3000
      - "traefik.http.services.site.loadbalancer.server.port=3000"

  # Site (staging): Development build of the site for `staging.everythingsjake.net`.
  # Uses the `dev` image tag; routed by Traefik to port 3000 for testing.
  site-staging:
    image: ghcr.io/everythingsjake/everythingsjake-platform:dev
    container_name: everythingsjake-site-staging
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"

      # HTTP router: redirect to HTTPS
      - "traefik.http.routers.staging-http.rule=Host(`staging.everythingsjake.net`)"
      - "traefik.http.routers.staging-http.entrypoints=web"
      - "traefik.http.routers.staging-http.middlewares=redirect-to-https"

      # HTTPS router: serve the app with TLS via Let's Encrypt
      - "traefik.http.routers.staging-https.rule=Host(`staging.everythingsjake.net`)"
      - "traefik.http.routers.staging-https.entrypoints=websecure"
      - "traefik.http.routers.staging-https.tls=true"
      - "traefik.http.routers.staging-https.tls.certresolver=letsencrypt"

      # Site-Staging points to the container port 3000
      - "traefik.http.services.staging.loadbalancer.server.port=3000"

  # Watchtower: Automatic container updater.
  # Polls Docker for image updates, can cleanup old images, and honors labels.
  watchtower:
    environment:
        - DOCKER_API_VERSION=1.44
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jake/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup --label-enable

  # Uptime Kuma: Uptime monitoring dashboard.
  # Persists data under `./uptime-kuma`. Routed by Traefik at `status.everythingsjake.net`.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./uptime-kuma:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"

      # HTTP router: redirect to HTTPS
      - "traefik.http.routers.kuma-http.rule=Host(`status.everythingsjake.net`)"
      - "traefik.http.routers.kuma-http.entrypoints=web"
      - "traefik.http.routers.kuma-http.middlewares=redirect-to-https"

      # HTTPS router: serve the app with TLS via Let's Encrypt
      - "traefik.http.routers.kuma-https.rule=Host(`status.everythingsjake.net`)"
      - "traefik.http.routers.kuma-https.entrypoints=websecure"
      - "traefik.http.routers.kuma-https.tls=true"
      - "traefik.http.routers.kuma-https.tls.certresolver=letsencrypt"

      # Kuma listens on 3001 inside the container
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"
